name: release

# A tag v* builds, signs and publishes a release. The signing key is the project's, so macOS
# keeps deskrig's permissions from one release to the next.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          SIGNING_PEM: ${{ secrets.DESKRIG_SIGNING_PEM }}
        run: |
          umask 077
          printf '%s\n' "$SIGNING_PEM" > "$RUNNER_TEMP/signing.pem"
          DESKRIG_SIGNING_KEY="$RUNNER_TEMP/signing.pem" DESKRIG_VERSION="$GITHUB_REF_NAME" ./build.sh all
          rm -f "$RUNNER_TEMP/signing.pem"
          mkdir dist
          cp build/deskrig-darwin-arm64 build/deskrig-darwin-amd64 dist/
          cd dist && shasum -a 256 deskrig-darwin-* > SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
